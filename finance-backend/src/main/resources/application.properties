spring.application.name=finance-app

# อ่านค่า DB_* จาก .env ที่ root (path นับจากโฟลเดอร์ที่รัน = finance-backend) · env ของระบบยังมีผลเหนือกว่า
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema="finance-app"}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=finance-app
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8081

# ความปลอดภัย — key/secret มาจาก .env (ไม่มีค่า default: ถ้าไม่ได้ตั้ง แอปจะไม่ยอม start)
app.security.password-key=${PASSWORD_ENC_KEY}
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-ttl-days=7
app.security.cookie-secure=${COOKIE_SECURE:false}

spring.jackson.serialization.write-dates-as-timestamps=false